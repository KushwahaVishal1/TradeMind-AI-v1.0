name: tests

on:
  push:
    branches: [main]
  pull_request:

# PYTHONHASHSEED must be set before the interpreter starts; it cannot be set
# from inside a running process. Without it, set iteration order can vary
# between runs and "deterministic" is not quite true.
env:
  PYTHONHASHSEED: "42"

jobs:
  protected:
    # Runs first and alone. These are the invariants that block a merge, they
    # take seconds, and a developer waiting on a slow suite eventually stops
    # waiting. Fast feedback on the rules that matter most.
    name: protected invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run protected invariants
        run: pytest -m protected -v --tb=short

  full:
    name: full suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: protected
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --tb=short --durations=10

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    needs: protected
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: First run
        run: pytest -m protected --collect-only -q > run1.txt
      - name: Second run
        run: pytest -m protected --collect-only -q > run2.txt
      - name: Compare
        run: |
          diff run1.txt run2.txt && echo "deterministic" || {
            echo "::error::Protected suite test collection is not deterministic"
            exit 1
          }